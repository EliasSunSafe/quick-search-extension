<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快搜 · 界面预览</title>
  <link rel="stylesheet" href="../src/base.css">
  <link rel="stylesheet" href="../src/popup.css">
  <script>
    // 截图时可用 ?theme=light 强制浅色（仅预览用）
    if (new URLSearchParams(location.search).get('theme') === 'light') {
      document.documentElement.classList.add('force-light');
    }
  </script>
  <style>
    /* 仅用于生成 README 截图，不参与扩展运行 */
    html.force-light {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --on-accent: #ffffff;
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.10);
      --ok: #059669;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    body {
      display: grid;
      place-items: center;
      width: auto;
      min-height: 100vh;
      padding: 28px;
      background: radial-gradient(120% 120% at 12% 0%, #e7eeff 0%, #f5f7fb 46%, #eef1ff 100%);
    }

    .popup {
      width: 380px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      background: var(--bg);
      box-shadow: 0 30px 70px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.06);
    }
  </style>
</head>
<body>
  <main class="popup">
    <header class="popup-head">
      <div class="brand">
        <img class="brand-icon" src="../icons/icon32.png" alt="" width="20" height="20">
        <span class="brand-name">快搜</span>
        <span class="brand-current">Bing</span>
      </div>
      <span class="icon-btn" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </span>
    </header>

    <div class="search">
      <input class="search-input" type="text" value="edge 扩展开发" aria-label="搜索关键词">
      <span class="search-btn" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16.5 16.5 4 4"></path>
        </svg>
      </span>
    </div>

    <p class="hint">
      <span><kbd>Enter</kbd> 搜索</span>
      <span class="hint-dot">·</span>
      <span>点击卡片切换引擎</span>
    </p>

    <div class="engines">
      <span class="chip is-active">
        <span class="engine-icon" data-len="1" style="--badge-color: #0f7b6c">
          <span class="engine-icon-letter">B</span>
          <img class="engine-icon-img" src="https://www.bing.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">Bing</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="1" style="--badge-color: #4285f4">
          <span class="engine-icon-letter">G</span>
          <img class="engine-icon-img" src="https://www.google.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">Google</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="1" style="--badge-color: #2932e1">
          <span class="engine-icon-letter">百</span>
          <img class="engine-icon-img" src="https://www.baidu.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">百度</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="1" style="--badge-color: #ff6a00">
          <span class="engine-icon-letter">搜</span>
          <img class="engine-icon-img" src="https://www.sogou.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">搜狗</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="3" style="--badge-color: #1ab394">
          <span class="engine-icon-letter">360</span>
          <img class="engine-icon-img" src="https://www.so.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">360 搜索</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="1" style="--badge-color: #de5833">
          <span class="engine-icon-letter">D</span>
          <img class="engine-icon-img" src="https://duckduckgo.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">DuckDuckGo</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="1" style="--badge-color: #0084ff">
          <span class="engine-icon-letter">知</span>
          <img class="engine-icon-img" src="https://www.zhihu.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">知乎</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="1" style="--badge-color: #fb7299">
          <span class="engine-icon-letter">哔</span>
          <img class="engine-icon-img" src="https://www.bilibili.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">哔哩哔哩</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="2" style="--badge-color: #24292f">
          <span class="engine-icon-letter">GH</span>
          <img class="engine-icon-img" src="https://github.com/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">GitHub</span>
      </span>
      <span class="chip">
        <span class="engine-icon" data-len="1" style="--badge-color: #54595d">
          <span class="engine-icon-letter">W</span>
          <img class="engine-icon-img" src="https://zh.wikipedia.org/favicon.ico" alt="" referrerpolicy="no-referrer">
        </span>
        <span class="chip-name">维基百科</span>
      </span>
    </div>

    <footer class="popup-foot">
      <span class="check"><input type="checkbox" checked> <span>新标签页打开</span></span>
      <span class="status is-visible">已切换到「Bing」</span>
    </footer>
  </main>

  <script>
    // 图标加载成功才显示图片，失败时保留下面的字母徽标
    for (const img of document.querySelectorAll('.engine-icon-img')) {
      const mark = () => img.closest('.engine-icon')?.classList.add('has-icon');
      if (img.complete && img.naturalWidth > 0) mark();
      else img.addEventListener('load', mark);
    }
  </script>
</body>
</html>
